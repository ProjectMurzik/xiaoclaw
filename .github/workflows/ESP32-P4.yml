name: ESP32-P4 Firmware Build

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    # ✅ КЭШ: Учитывает изменения в конфиг-файлах и сбрасывает старые библиотеки
    - name: Cache ESP-IDF
      uses: actions/cache@v4
      with:
        path: |
          ~/.espressif
          esp-idf/components
          managed_components
        key: ${{ runner.os }}-esp-idf-v5.5-${{ hashFiles('**/CMakeLists.txt', '**/sdkconfig.defaults', '**/idf_component.yml') }}
        restore-keys: |
          ${{ runner.os }}-esp-idf-v5.5-

    - name: Setup ESP-IDF v5.5
      run: |
        if [ ! -d "esp-idf" ]; then
          git clone --depth 1 --branch release/v5.5 https://github.com/espressif/esp-idf.git
          cd esp-idf
          git submodule update --init --recursive
          ./install.sh esp32p4
        fi
        
    - name: Configure & Build
      run: |
        . ./esp-idf/export.sh
        
        # Принудительно удаляем старый конфиг и lock-файл зависимостей
        rm -f sdkconfig
        rm -f dependencies.lock
        
        # Настраиваем таргет и конфигурацию
        idf.py set-target esp32p4
        idf.py reconfigure
        
        # 🔥 ХАК: Патчим исходный код компонента, так как CFLAGS могут переопределяться
        # Это гарантированно отключит -Werror для проблемного файла
        KNOB_FILE="managed_components/espressif__esp_lvgl_port/src/lvgl8/esp_lvgl_port_knob.c"
        if [ -f "$KNOB_FILE" ]; then
          # Вставляем #pragma в первую строку файла — компилятор обязан его выполнить
          sed -i '1s/^/#pragma GCC diagnostic ignored "-Wmaybe-uninitialized"\n/' "$KNOB_FILE"
          echo "✅ Patched: added pragma to esp_lvgl_port_knob.c"
        fi
        
        # Опционально: патчим файл с deprecated warning (на будущее)
        TOUCH_FILE="managed_components/espressif__esp_lvgl_port/src/lvgl8/esp_lvgl_port_touch.c"
        if [ -f "$TOUCH_FILE" ]; then
          sed -i '1s/^/#pragma GCC diagnostic ignored "-Wdeprecated-declarations"\n/' "$TOUCH_FILE"
          echo "✅ Patched: added pragma to esp_lvgl_port_touch.c"
        fi
        
        # Глобальные флаги (страховка, вдруг сработают)
        export CFLAGS="-Wno-error=maybe-uninitialized -Wno-error=deprecated-declarations"
        export CXXFLAGS="-Wno-error=maybe-uninitialized -Wno-error=deprecated-declarations"
        
        # Запускаем сборку
        idf.py build

    # ✅ SIZE ANALYSIS: покажет таблицу компонентов в логе
    - name: Analyze Binary Size
      if: success()
      run: |
        . ./esp-idf/export.sh
        echo "📊 === COMPONENT SIZES ==="
        idf.py size-components
        echo "📊 === MEMORY MAP ==="
        idf.py size

    # ✅ FIX: Полные пути к всем .bin файлам
    - name: Upload Artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: murzik-esp32p4-firmware
        path: |
          build/*.bin
          build/bootloader/*.bin
          build/partition_table/*.bin
        retention-days: 7
