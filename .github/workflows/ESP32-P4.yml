name: ESP32-P4 Firmware Build

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Cache ESP-IDF
      uses: actions/cache@v4
      with:
        path: |
          ~/.espressif
          esp-idf/components
          managed_components
        key: ${{ runner.os }}-esp-idf-v5.5-${{ hashFiles('**/CMakeLists.txt', '**/sdkconfig.defaults', '**/idf_component.yml') }}
        restore-keys: |
          ${{ runner.os }}-esp-idf-v5.5-

    - name: Setup ESP-IDF v5.5
      run: |
        if [ ! -d "esp-idf" ]; then
          git clone --depth 1 --branch release/v5.5 https://github.com/espressif/esp-idf.git
          cd esp-idf
          git submodule update --init --recursive
          ./install.sh esp32p4
        fi
        
    - name: Configure & Build
      run: |
        . ./esp-idf/export.sh
        rm -f sdkconfig
        rm -f dependencies.lock
        
        # 1. Конфигурация
        idf.py set-target esp32p4
        idf.py reconfigure
        
        # 2. Патчим esp_lvgl_port (работает для lvgl8 и lvgl9 путей)
        for DIR in lvgl8 lvgl9; do
          FILE="managed_components/espressif__esp_lvgl_port/src/${DIR}/esp_lvgl_port_knob.c"
          if [ -f "$FILE" ]; then
            sed -i '1s/^/#pragma GCC diagnostic ignored "-Wmaybe-uninitialized"\n/' "$FILE"
            echo "✅ Patched: ${DIR}/esp_lvgl_port_knob.c"
          fi
        done
        
        # 3. Глобальные флаги компилятора
        export CFLAGS="-Wno-error=maybe-uninitialized -Wno-error=deprecated-declarations -Wno-int-conversion"
        export CXXFLAGS="-Wno-error=maybe-uninitialized -Wno-error=deprecated-declarations -Wno-int-conversion"
        
        # 4. Сборка
        idf.py build

    - name: Analyze Binary Size
      if: success()
      run: |
        . ./esp-idf/export.sh
        echo "📊 === COMPONENT SIZES ==="
        idf.py size-components
        echo "📊 === MEMORY MAP ==="
        idf.py size

    - name: Upload Artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: murzik-esp32p4-firmware
        path: |
          build/*.bin
          build/bootloader/*.bin
          build/partition_table/*.bin
        retention-days: 7
